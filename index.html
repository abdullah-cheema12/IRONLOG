<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iron Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #101114;
    --surface: #1a1c20;
    --surface-2: #212429;
    --border: #2b2e34;
    --text: #f2f3f5;
    --text-dim: #8b8f97;
    --text-faint: #565a61;
    --accent: #cbff4d;
    --accent-dim: #8fb838;
    --rest: #ff5c45;
    --rest-dim: #4a2620;
    --radius-s: 6px;
    --radius-m: 10px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y: none;
  }

  .app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom: 100px;
  }

  /* Header */
  header{
    padding: 18px 18px 14px;
    position: sticky;
    top:0;
    background: linear-gradient(var(--bg) 80%, transparent);
    z-index: 20;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .brand h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    margin:0;
    line-height:1;
  }
  .brand h1 span{ color:var(--accent); }
  .date-pill{
    font-size:12px;
    color:var(--text-dim);
    font-weight:600;
  }

  /* Day scroller */
  .day-scroller{
    display:flex;
    gap:8px;
    margin-top:16px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .day-scroller::-webkit-scrollbar{ display:none; }
  .day-pill{
    flex: 0 0 auto;
    padding: 9px 14px;
    border-radius: 999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:56px;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .day-pill .d{ font-size:11px; letter-spacing:.3px; opacity:.8; }
  .day-pill .m{ font-size:10px; margin-top:2px; text-transform:uppercase; letter-spacing:.4px; }
  .day-pill.today{ border-color: var(--accent-dim); }
  .day-pill.today .d::after{
    content:'';
    display:block;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--accent);
    margin:3px auto 0;
  }
  .day-pill.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#101114;
  }
  .day-pill.active .m{ color:#101114; opacity:.7; }
  .day-pill.rest-day{ opacity:.55; }

  /* Session summary */
  .session{
    padding: 6px 18px 10px;
  }
  .session-title{
    font-family:'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing:.5px;
    line-height:1;
    margin: 4px 0 0;
  }
  .session-subtitle{
    font-size:12.5px;
    color:var(--text-dim);
    font-weight:600;
    margin: 3px 0 6px;
  }
  .session-meta{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text-dim);
    font-size:13px;
    font-weight:500;
    flex-wrap:wrap;
  }
  .session-meta .dot{ width:3px; height:3px; border-radius:50%; background:var(--text-faint); }

  .progress-track{
    margin-top:14px;
    height:6px;
    border-radius:4px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    border-radius:4px;
    width:0%;
    transition: width .35s ease;
  }

  /* Exercise list */
  .list{
    padding: 8px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .group-label{
    font-size:11px;
    font-weight:700;
    color: var(--text-faint);
    letter-spacing:.4px;
    margin: 10px 2px 0;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:14px 14px 12px;
    transition: border-color .2s ease;
  }
  .card.complete{ border-color: var(--accent-dim); }

  .card-top{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }

  .ex-icon{
    flex:0 0 auto;
    width:48px;
    height:48px;
    border-radius:var(--radius-s);
    background:var(--surface-2);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px;
  }
  .ex-icon-svg{ width:100%; height:100%; overflow:visible; }
  .ex-icon-svg line{ stroke:var(--text-dim); stroke-width:6; stroke-linecap:round; }
  .ex-icon-svg circle{ stroke:var(--text-dim); stroke-width:6; fill:none; }
  .ex-icon-svg circle.wt{ fill:var(--accent); stroke:none; }
  .card.complete .ex-icon{ border-color: var(--accent-dim); }
  .card.complete .ex-icon-svg line,
  .card.complete .ex-icon-svg circle:not(.wt){ stroke: var(--accent-dim); }

  .card-info{ flex:1; min-width:0; }
  .card-info-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .ex-name{
    font-size:15.5px;
    font-weight:700;
    line-height:1.25;
  }
  .ex-detail{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:3px;
    font-weight:500;
  }
  .ex-detail b{ color:var(--text); font-weight:700; }
  .ex-detail .rest-txt{ color: var(--text-faint); }

  .set-count{
    font-size:12px;
    font-weight:700;
    color:var(--text-dim);
    white-space:nowrap;
    padding-top:2px;
    flex-shrink:0;
  }
  .set-count.done{ color:var(--accent); }

  .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
    gap:10px;
  }

  .set-dots{
    display:flex;
    gap:6px;
  }
  .set-dot{
    width:24px; height:24px;
    border-radius:50%;
    border:1.5px solid var(--border);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-faint);
    font-size:10px;
    font-weight:700;
    transition: all .15s ease;
    flex-shrink:0;
  }
  .set-dot.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#101114;
  }

  .complete-btn{
    width:100%;
    margin-top:10px;
    border:none;
    border-radius: var(--radius-s);
    background: var(--accent);
    color: #101114;
    font-size:13px;
    font-weight:800;
    letter-spacing:.3px;
    padding:10px 12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition: transform .1s ease, background .15s ease, color .15s ease;
  }
  .complete-btn:active{ transform: scale(.98); }
  .complete-btn.done{
    background: var(--surface-2);
    color: var(--text-faint);
    cursor:default;
  }
  .complete-btn.done:active{ transform:none; }

  /* Empty / rest day state */
  .empty-state{
    margin: 30px 18px 0;
    padding: 30px 20px;
    border:1px dashed var(--border);
    border-radius: var(--radius-m);
    text-align:center;
  }
  .empty-state .emoji{ font-size:34px; margin-bottom:6px; }
  .empty-state h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:.5px;
    color: var(--text-dim);
  }
  .empty-state p{
    font-size:13px;
    color:var(--text-faint);
    margin:0;
    line-height:1.5;
  }

  /* Bottom rest timer bar */
  .timer-bar{
    position: fixed;
    left:50%;
    transform: translateX(-50%) translateY(120%);
    bottom: 16px;
    width: calc(100% - 32px);
    max-width: 448px;
    background: var(--surface-2);
    border:1px solid var(--border);
    border-radius: var(--radius-m);
    padding: 12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    z-index: 50;
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
    transition: transform .3s cubic-bezier(.32,.9,.4,1.1);
  }
  .timer-bar.show{ transform: translateX(-50%) translateY(0); }
  .timer-bar.done{ border-color: var(--accent); }

  .timer-info{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .timer-label{
    font-size:10.5px;
    font-weight:700;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .timer-ex{
    font-size:13px;
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .timer-clock{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing:1px;
    color: var(--rest);
    min-width:64px;
    text-align:center;
  }
  .timer-bar.done .timer-clock{ color:var(--accent); }

  .timer-actions{ display:flex; align-items:center; gap:6px; }
  .timer-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    width:32px; height:32px;
    border-radius:50%;
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .timer-btn:active{ background: var(--surface); }
  .timer-close{
    background: var(--rest);
    border:none;
    color:#101114;
    width:32px; height:32px;
    border-radius:50%;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:800;
  }
  .timer-bar.done .timer-close{ background: var(--accent); }

  .reset-row{
    padding: 4px 18px 0;
    display:flex;
    justify-content:flex-end;
  }
  .reset-btn{
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:6px 2px;
  }
  .reset-btn:active{ color:var(--text-dim); }
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div class="brand">
      <h1>IRON<span>LOG</span></h1>
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="bellBtn" title="Enable background alerts" style="background:none;border:1px solid var(--border);border-radius:999px;width:30px;height:30px;color:var(--text-dim);font-size:14px;cursor:pointer;">🔔</button>
        <div class="date-pill" id="todayLabel"></div>
      </div>
    </div>
    <div class="day-scroller" id="dayScroller"></div>
  </header>

  <div class="session" id="sessionBlock"></div>
  <div class="reset-row" id="resetRow"></div>
  <div class="list" id="list"></div>
</div>

<div class="timer-bar" id="timerBar">
  <div class="timer-info">
    <div class="timer-label" id="timerLabel">RESTING</div>
    <div class="timer-ex" id="timerExName">—</div>
  </div>
  <div class="timer-clock" id="timerClock">0:00</div>
  <div class="timer-actions">
    <button class="timer-btn" id="timerMinus">−15</button>
    <button class="timer-btn" id="timerPlus">+15</button>
    <button class="timer-close" id="timerClose">✕</button>
  </div>
</div>

<script>
/* ================= ICONS ================= */
/* Minimal line-art pictograms built from simple shapes — no external images,
   so nothing to break or mismatch. head = [cx,cy,r], lines = [[x1,y1,x2,y2]...],
   dots = weight/plate markers = [[cx,cy,r]...] */
const ICON_DEFS = {
  pressFlat: { head:[22,52,8], lines:[[30,52,58,52],[58,52,66,66],[66,66,76,58],[38,52,38,26],[48,52,48,26],[18,24,66,24],[12,60,80,60]], dots:[[16,24,6],[68,24,6]] },
  pressIncline: { head:[20,46,8], lines:[[28,48,54,60],[54,60,64,74],[64,74,74,66],[36,52,34,28],[46,56,50,30],[16,26,62,26],[10,66,58,80]], dots:[[14,26,6],[64,26,6]] },

  fly: { head:[20,55,8], lines:[[28,55,58,55],[58,55,66,68],[66,68,76,60],[34,55,14,44],[34,55,14,66],[14,62,80,62]], dots:[[12,44,6],[12,66,6]] },
  pullover: { head:[20,55,8], lines:[[28,55,58,55],[58,55,66,68],[66,68,76,60],[34,55,16,40],[16,40,10,24],[14,62,80,62]], dots:[[10,22,7]] },
  pushup: { head:[20,48,7], lines:[[27,48,70,48],[35,48,35,64],[60,48,60,64],[70,48,86,54],[15,64,90,64]], dots:[] },
  curl: { head:[50,20,9], lines:[[50,29,50,58],[50,58,42,88],[50,58,58,88],[50,34,60,58],[50,34,38,50],[38,50,42,34]], dots:[[42,34,6]] },
  tricepsOverhead: { head:[50,20,9], lines:[[50,29,50,58],[50,58,42,88],[50,58,58,88],[50,34,60,58],[50,34,38,14],[38,14,46,32]], dots:[[46,32,6]] },
  wristCurl: { head:[22,48,8], lines:[[20,62,80,62],[34,62,62,62],[26,50,34,62],[56,56,70,68]], dots:[[56,56,5],[70,68,5]] },
  deadlift: { head:[50,24,8], lines:[[50,32,40,54],[40,54,36,88],[40,54,46,88],[42,44,34,70],[42,48,38,72],[18,72,55,72]], dots:[[16,72,7],[58,72,7]] },
  row: { head:[35,32,9], lines:[[35,41,58,58],[58,58,54,90],[58,58,66,88],[44,48,38,64],[44,48,36,70]], dots:[[38,64,6]] },
  shrug: { head:[50,20,9], lines:[[50,29,50,58],[50,58,42,88],[50,58,58,88],[50,34,30,66],[50,34,70,66],[28,68,72,68],[34,29,38,22],[42,29,38,22],[58,29,62,22],[66,29,62,22]], dots:[[26,68,6],[74,68,6]] },
  overheadPress: { head:[50,22,9], lines:[[50,31,50,58],[50,58,42,88],[50,58,58,88],[50,34,35,12],[50,34,65,12],[25,10,75,10]], dots:[[22,10,6],[78,10,6]] },
  raiseSide: { head:[50,20,9], lines:[[50,29,50,58],[50,58,42,88],[50,58,58,88],[50,34,20,34],[50,34,80,34]], dots:[[18,34,6],[82,34,6]] },
  raiseFront: { head:[50,20,9], lines:[[50,29,50,58],[50,58,42,88],[50,58,58,88],[50,34,35,15],[50,34,65,15]], dots:[[33,15,6],[67,15,6]] },
  rearFly: { head:[35,32,9], lines:[[35,41,58,58],[58,58,54,90],[58,58,66,88],[44,48,24,43],[44,48,64,60]], dots:[[22,43,6],[66,60,6]] },
  squat: { head:[50,20,9], lines:[[50,29,50,50],[50,50,35,65],[35,65,30,88],[50,50,65,65],[65,65,70,88],[50,34,35,40],[50,34,65,40],[38,25,62,25]], dots:[[36,25,5],[64,25,5]] },
  lunge: { head:[50,20,9], lines:[[50,29,50,52],[50,52,65,60],[65,60,68,88],[50,52,35,68],[35,68,28,85],[50,34,45,55],[50,34,55,55]], dots:[[45,57,5],[55,57,5]] },
  hipThrust: { head:[15,60,7], lines:[[25,60,50,45],[50,45,65,65],[65,65,60,80],[42,42,58,42],[10,80,90,80]], dots:[[40,42,5],[60,42,5]] },
  calfRaise: { head:[50,18,9], lines:[[50,27,50,55],[50,55,42,85],[50,55,58,85],[40,85,36,90],[56,85,60,90],[38,23,62,23]], dots:[[36,23,5],[64,23,5]] },
  pullup: { head:[50,35,8], lines:[[25,15,75,15],[35,15,42,30],[65,15,58,30],[50,44,50,68],[50,68,45,90],[50,68,55,90]], dots:[] },
};

function renderIconSVG(key){
  const def = ICON_DEFS[key];
  if(!def) return '';
  let s = '<svg viewBox="0 0 100 100" class="ex-icon-svg">';
  def.lines.forEach(([x1,y1,x2,y2]) => { s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; });
  if (def.head) s += `<circle cx="${def.head[0]}" cy="${def.head[1]}" r="${def.head[2]}"/>`;
  def.dots.forEach(([cx,cy,r]) => { s += `<circle cx="${cx}" cy="${cy}" r="${r}" class="wt"/>`; });
  s += '</svg>';
  return s;
}

/* ================= PROGRAM DATA (from user's plan) ================= */
/* restSec is used to drive the rest timer; restLabel is what's shown on the card. */
const PROGRAM = {
  Monday: {
    focus: "Chest", subtitle: null,
    groups: [{ label:null, exercises: [
      { name:"Barbell Bench Press", icon:"pressFlat", reps:"6–10", sets:4, restLabel:"40 Sec", restSec:40 },
      { name:"Incline Dumbbell Press", icon:"pressIncline", reps:"8–12", sets:4, restLabel:"40 Sec", restSec:40 },
      { name:"Decline Barbell Press", icon:"pressDecline", reps:"8–12", sets:3, restLabel:"40 Sec", restSec:40 },
      { name:"Dumbbell Fly", icon:"fly", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
      { name:"Butterfly / Pec Deck Machine", icon:"fly", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },

  },
  Tuesday: {
    focus: "Arms", subtitle: "Biceps · Triceps · Forearms",
    groups: [
      { label:"Biceps", exercises: [
        { name:"Barbell Curl", icon:"curl", reps:"8–12", sets:4, restLabel:"40 Sec", restSec:40 },
        { name:"Incline Dumbbell Curl", icon:"curl", reps:"8–12", sets:3, restLabel:"40 Sec", restSec:40 },
        { name:"Hammer Curl", icon:"curl", reps:"10–12", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Triceps", exercises: [
        { name:"Close-Grip Barbell Bench Press", icon:"pressFlat", reps:"6–10", sets:4, restLabel:"40 Sec", restSec:40 },
        { name:"Overhead Dumbbell Triceps Extension", icon:"tricepsOverhead", reps:"10–12", sets:3, restLabel:"40 Sec", restSec:40 },
        { name:"Dumbbell Skull Crusher", icon:"tricepsOverhead", reps:"10–12", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Forearms", exercises: [
        { name:"Barbell Wrist Curl", icon:"wristCurl", reps:"12–15", sets:3, restLabel:"40 Sec", restSec:40 },
        { name:"Reverse Barbell Wrist Curl", icon:"wristCurl", reps:"12–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
    ]
  },
  Wednesday: {
    focus: "Back", subtitle: "Lower · Middle · Lats · Traps",
    groups: [
      { label:"Lower Back", exercises: [
        { name:"Barbell Deadlift", icon:"deadlift", reps:"5–8", sets:4, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Middle Back", exercises: [
        { name:"Barbell Bent-Over Row", icon:"row", reps:"6–10", sets:4, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Lats", exercises: [
        { name:"One-Arm Dumbbell Row", icon:"row", reps:"8–12", sets:3, restLabel:"40 Sec", restSec:40 },
        { name:"Dumbbell Pullover", icon:"pullover", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Traps", exercises: [
        { name:"Barbell Shrugs", icon:"shrug", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Rear Back / Shoulders", exercises: [
        { name:"Dumbbell Rear-Delt Row", icon:"row", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
    ]
  },
  Thursday: {
    focus: "Shoulders", subtitle: null,
    groups: [
      { label:"Shoulders", exercises: [
        { name:"Arnold Dumbbell Press", icon:"overheadPress", reps:"8–12", sets:4, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Side Delts", exercises: [
        { name:"Dumbbell Lateral Raise", icon:"raiseSide", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Front Delts", exercises: [
        { name:"Dumbbell Front Raise", icon:"raiseFront", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Rear Delts", exercises: [
        { name:"Dumbbell Rear-Delt Fly", icon:"rearFly", reps:"12–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Traps", exercises: [
        { name:"Dumbbell Shrugs", icon:"shrug", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
        { name:"Barbell Shrugs", icon:"shrug", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
    ]
  },
  Friday: { focus: null, subtitle:null, groups: [] },
  Saturday: {
    focus: "Legs", subtitle: "Quads · Hamstrings · Glutes · Calves",
    groups: [
      { label:"Quads", exercises: [
        { name:"Barbell Back Squat", icon:"squat", reps:"6–10", sets:4, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Quads / Glutes", exercises: [
        { name:"Dumbbell Bulgarian Split Squat", icon:"lunge", reps:"8–12", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Quads", exercises: [
        { name:"Dumbbell Goblet Squat", icon:"squat", reps:"10–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Hamstrings", exercises: [
        { name:"Barbell Romanian Deadlift", icon:"deadlift", reps:"8–12", sets:4, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Glutes", exercises: [
        { name:"Dumbbell Walking Lunges", icon:"lunge", reps:"10–12/leg", sets:3, restLabel:"40 Sec", restSec:40 },
        { name:"Barbell Hip Thrust", icon:"hipThrust", reps:"8–12", sets:4, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Calves", exercises: [
        { name:"Standing Dumbbell Calf Raise", icon:"calfRaise", reps:"12–20", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
    ]
  },
  Sunday: {
    focus: "Full Body", subtitle: "Chest · Back · Shoulders · Arms",
    groups: [
      { label:"Upper Chest", exercises: [
        { name:"Incline Barbell Bench Press", icon:"pressIncline", reps:"6–10", sets:4, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Lats", exercises: [
        { name:"Pull-Ups / Chin-Ups", icon:"pullup", reps:"Near Failure", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Shoulders", exercises: [
        { name:"Dumbbell Shoulder Press", icon:"overheadPress", reps:"8–12", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Back", exercises: [
        { name:"One-Arm Dumbbell Row", icon:"row", reps:"10–12", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Side Delts", exercises: [
        { name:"Dumbbell Lateral Raise", icon:"raiseSide", reps:"12–15", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Biceps", exercises: [
        { name:"Dumbbell Hammer Curl", icon:"curl", reps:"10–12", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
      { label:"Triceps", exercises: [
        { name:"Close-Grip Push-Ups", icon:"pushup", reps:"Near Failure", sets:3, restLabel:"40 Sec", restSec:40 },
      ]},
    ]
  },
};

const DAY_ORDER = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY_SHORT = { Monday:"Mon", Tuesday:"Tue", Wednesday:"Wed", Thursday:"Thu", Friday:"Fri", Saturday:"Sat", Sunday:"Sun" };
const PILL_LABEL = { Monday:"Chest", Tuesday:"Arms", Wednesday:"Back", Thursday:"Shldr", Friday:"Off", Saturday:"Legs", Sunday:"Mix" };

/* ---------------- State ---------------- */
const todayIdx = new Date().getDay(); // 0=Sun
const todayName = DAY_ORDER[(todayIdx + 6) % 7];
let activeDay = PROGRAM[todayName].groups.length ? todayName : "Monday";

function flattenExercises(day){
  const out = [];
  PROGRAM[day].groups.forEach(g => { g.exercises.forEach(ex => out.push({ ...ex, group: g.label })); });
  return out;
}

const completion = {};
DAY_ORDER.forEach(day => {
  completion[day] = flattenExercises(day).map(ex => new Array(ex.sets).fill(false));
});

/* ---------------- Audio (beep on rest end) ---------------- */
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playBeep(){
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  for (let i = 0; i < 2; i++){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 440;
    const t = now + i * 0.45;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.37);
  }
}

/* ---------------- Wake Lock (keep screen on while resting) ---------------- */
let wakeLock = null;
async function requestWakeLock(){
  try {
    if ('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e){ /* not supported, or page not focused — fail silently */ }
}
function releaseWakeLock(){
  if (wakeLock){ wakeLock.release(); wakeLock = null; }
}
// Re-acquire if the tab regains visibility mid-rest (OS auto-releases on hide)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timerInterval) requestWakeLock();
});

/* ---------------- Notification fallback (if tab gets backgrounded) ---------------- */
function askNotifyPermission(){
  if ('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}
function notifyRestOver(name){
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden){
    try {
      const n = new Notification('Rest over 💪', { body: `Next set: ${name}`, tag: 'rest-timer' });
      n.onclick = () => window.focus();
    } catch(e){ /* ignore */ }
  }
}

/* ---------------- Timer state ---------------- */
let timerInterval = null;
let timerRemaining = 0;
let timerDone = false;

/* ---------------- Rendering ---------------- */
const dayScroller = document.getElementById('dayScroller');
const sessionBlock = document.getElementById('sessionBlock');
const listEl = document.getElementById('list');
const resetRow = document.getElementById('resetRow');
const todayLabel = document.getElementById('todayLabel');

todayLabel.textContent = new Date().toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });

function renderDayScroller(){
  dayScroller.innerHTML = "";
  DAY_ORDER.forEach(day => {
    const isRestDay = PROGRAM[day].groups.length === 0;
    const pill = document.createElement('div');
    pill.className = 'day-pill'
      + (day === activeDay ? ' active' : '')
      + (day === todayName ? ' today' : '')
      + (isRestDay ? ' rest-day' : '');
    pill.innerHTML = `<span class="d">${DAY_SHORT[day]}</span><span class="m">${PILL_LABEL[day]}</span>`;
    pill.addEventListener('click', () => { activeDay = day; renderAll(); });
    dayScroller.appendChild(pill);
  });
}

function renderSession(){
  const day = PROGRAM[activeDay];

  if (!day.groups.length){
    sessionBlock.innerHTML = `<div class="session-title">Rest Day</div>`;
    resetRow.innerHTML = "";
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="emoji">💤</div>
        <h2>No lifting today</h2>
        <p>Friday's off the plan. Stretch, walk, or let the muscle rebuild — it's part of the work.</p>
      </div>`;
    return;
  }

  const flat = flattenExercises(activeDay);
  const totalSets = flat.reduce((a,ex)=>a+ex.sets,0);
  const doneSets = completion[activeDay].reduce((a,arr)=>a+arr.filter(Boolean).length,0);
  const estMinutes = Math.round(flat.reduce((a,ex)=> a + ex.sets * ((ex.restSec + 40)/60), 0));

  sessionBlock.innerHTML = `
    <div class="session-title">${day.focus}</div>
    ${day.subtitle ? `<div class="session-subtitle">${day.subtitle}</div>` : ''}
    <div class="session-meta">
      <span>${flat.length} exercise${flat.length>1?'s':''}</span>
      <span class="dot"></span>
      <span>~${estMinutes} min</span>
      <span class="dot"></span>
      <span>${doneSets}/${totalSets} sets</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${totalSets? (doneSets/totalSets*100):0}%"></div></div>
  `;

  resetRow.innerHTML = `<button class="reset-btn" id="resetBtn">Reset today's progress</button>`;
  document.getElementById('resetBtn').addEventListener('click', () => {
    completion[activeDay] = flat.map(ex => new Array(ex.sets).fill(false));
    renderAll();
  });
}

function renderList(){
  const day = PROGRAM[activeDay];
  if (!day.groups.length){ listEl.innerHTML = ""; return; }

  listEl.innerHTML = "";
  let flatIndex = 0;
  const multiGroup = day.groups.length > 1;

  day.groups.forEach(g => {
    if (multiGroup && g.label){
      const lab = document.createElement('div');
      lab.className = 'group-label';
      lab.textContent = g.label.toUpperCase();
      listEl.appendChild(lab);
    }
    g.exercises.forEach(ex => {
      listEl.appendChild(renderCard(ex, flatIndex));
      flatIndex++;
    });
  });
}

function renderCard(ex, index){
  const sets = completion[activeDay][index];
  const doneCount = sets.filter(Boolean).length;
  const isComplete = doneCount === ex.sets;

  const card = document.createElement('div');
  card.className = 'card' + (isComplete ? ' complete' : '');

  const dotsHtml = sets.map((on, i) => `<div class="set-dot ${on?'on':''}" data-i="${i}">${on ? '✓' : i+1}</div>`).join('');

  card.innerHTML = `
    <div class="card-top">
      <div class="ex-icon">${renderIconSVG(ex.icon)}</div>
      <div class="card-info">
        <div class="card-info-row">
          <div class="ex-name">${ex.name}</div>
          <div class="set-count ${isComplete?'done':''}">${doneCount}/${ex.sets}</div>
        </div>
        <div class="ex-detail"><b>${ex.sets}</b> sets × <b>${ex.reps}</b> reps · <span class="rest-txt">${ex.restLabel} rest</span></div>
      </div>
    </div>
    <div class="card-bottom">
      <div class="set-dots">${dotsHtml}</div>
    </div>
    <button class="complete-btn ${isComplete ? 'done' : ''}" ${isComplete ? 'disabled' : ''}>
      ${isComplete ? '✓ All Sets Complete' : `Complete Set ${doneCount + 1}`}
    </button>
  `;

  card.querySelectorAll('.set-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      ensureAudio();
      const i = parseInt(dot.dataset.i);
      const wasOn = completion[activeDay][index][i];
      completion[activeDay][index][i] = !wasOn;
      if (!wasOn) startTimer(ex.restSec, ex.name);
      renderSession();
      renderList();
    });
  });

  const btn = card.querySelector('.complete-btn');
  if (!isComplete){
    btn.addEventListener('click', () => {
      ensureAudio();
      const nextIdx = completion[activeDay][index].findIndex(v => !v);
      if (nextIdx !== -1){
        completion[activeDay][index][nextIdx] = true;
        startTimer(ex.restSec, ex.name);
        renderSession();
        renderList();
      }
    });
  }

  return card;
}

function renderAll(){
  renderDayScroller();
  renderSession();
  renderList();
}

/* ---------------- Timer logic ---------------- */
const timerBar = document.getElementById('timerBar');
const timerClock = document.getElementById('timerClock');
const timerExNameEl = document.getElementById('timerExName');
const timerLabelEl = document.getElementById('timerLabel');

function formatClock(sec){
  const s = Math.max(0, sec);
  const m = Math.floor(s/60);
  const r = s % 60;
  return `${m}:${r.toString().padStart(2,'0')}`;
}

function startTimer(seconds, name){
  clearInterval(timerInterval);
  timerRemaining = seconds;
  timerDone = false;
  timerBar.classList.remove('done');
  timerLabelEl.textContent = 'RESTING';
  timerExNameEl.textContent = name;
  timerClock.textContent = formatClock(timerRemaining);
  timerBar.classList.add('show');
  requestWakeLock();
  currentTimerExName = name;

  timerInterval = setInterval(() => {
    timerRemaining--;
    if (timerRemaining <= 0){
      timerRemaining = 0;
      timerClock.textContent = "0:00";
      finishTimer();
      return;
    }
    timerClock.textContent = formatClock(timerRemaining);
  }, 1000);
}

function finishTimer(){
  clearInterval(timerInterval);
  timerDone = true;
  timerBar.classList.add('done');
  timerLabelEl.textContent = 'READY';
  timerClock.textContent = "GO";
  playBeep();
  if (navigator.vibrate) navigator.vibrate([120,60,120]);
  notifyRestOver(currentTimerExName);
  releaseWakeLock();
}

function closeTimer(){
  clearInterval(timerInterval);
  timerBar.classList.remove('show');
  releaseWakeLock();
}

let currentTimerExName = "";

document.getElementById('timerClose').addEventListener('click', closeTimer);
document.getElementById('timerPlus').addEventListener('click', () => {
  if (timerDone) return;
  timerRemaining += 15;
  timerClock.textContent = formatClock(timerRemaining);
});
document.getElementById('timerMinus').addEventListener('click', () => {
  if (timerDone) return;
  timerRemaining = Math.max(0, timerRemaining - 15);
  timerClock.textContent = formatClock(timerRemaining);
  if (timerRemaining === 0) finishTimer();
});

document.getElementById('bellBtn').addEventListener('click', () => {
  askNotifyPermission();
  ensureAudio();
  const btn = document.getElementById('bellBtn');
  if ('Notification' in window){
    setTimeout(() => {
      if (Notification.permission === 'granted'){ btn.textContent = '🔔'; btn.style.color = 'var(--accent)'; btn.style.borderColor = 'var(--accent-dim)'; }
      else if (Notification.permission === 'denied'){ btn.textContent = '🔕'; }
    }, 300);
  }
});

/* ---------------- Init ---------------- */
renderAll();
</script>
